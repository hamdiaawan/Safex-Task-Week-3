<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SafeX Chat Demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        #messages { height: 350px; overflow-y: auto; border: 1px solid #ddd; padding: 10px; background: #fafafa; }
        .message { margin-bottom: 8px; }
        .sender { font-weight: bold; margin-right: 5px; }
        .read-status { font-size: 11px; color: #888; margin-left: 6px; }
        #unread-badge { display: none; background: red; color: white; border-radius: 10px; padding: 2px 7px; font-size: 12px; }
    </style>
</head>
<body class="p-4">

    <h4>SafeX Chat - Demo <span id="unread-badge">0</span></h4>

    <div class="mb-2">
        <input id="user-id-input" class="form-control d-inline-block w-auto" placeholder="Your user id e.g. intern1" />
        <input id="other-id-input" class="form-control d-inline-block w-auto" placeholder="Other user id e.g. company1" />
        <input id="conversation-id-input" type="number" class="form-control d-inline-block w-auto" placeholder="Conversation ID" />
        <button class="btn btn-primary" onclick="connectClicked()">Connect</button>
    </div>

    <p>Status: <span id="status">Not connected</span> | Peer: <span id="peer-status">-</span></p>

    <div id="messages"></div>

    <div class="mt-2 d-flex gap-2">
        <input id="msg-input" class="form-control" placeholder="Type a message..." onkeydown="if(event.key==='Enter') sendMessage()">
        <button class="btn btn-success" onclick="sendMessage()">Send</button>
        <input type="file" id="file-input" onchange="sendFile(this)">
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@microsoft/signalr@8.0.0/dist/browser/signalr.min.js"></script>
    <script src="js/chat.js"></script>
    <script>
        function connectClicked() {
            const userId = document.getElementById("user-id-input").value.trim();
            otherUserId = document.getElementById("other-id-input").value.trim();
            currentConversationId = parseInt(document.getElementById("conversation-id-input").value);
            if (!userId || !otherUserId || !currentConversationId) {
                alert("fill all 3 fields");
                return;
            }
            startConnection(userId);
        }
    </script>
</body>
</html>
